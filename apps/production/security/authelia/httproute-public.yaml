---
# Public-facing authelia portal at auth.lewelly.com via the cloudflared
# lewelly tunnel + traefik public-gateway. No auth filter on the portal itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia-public
  namespace: authelia
  labels:
    app.kubernetes.io/part-of: home-infra
    exposure: public
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - auth.lewelly.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authelia
          port: 80
