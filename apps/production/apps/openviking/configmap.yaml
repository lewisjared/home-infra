---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: openviking
data:
  ov.conf: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 1,
        "auth_mode": "api_key",
        "root_api_key": "__OPENVIKING_ROOT_API_KEY__",
        "cors_origins": ["https://openviking.home.lewelly.com"]
      },
      "storage": {
        "workspace": "/app/.openviking/openviking_workspace",
        "vectordb": {
          "name": "context_qwen3",
          "backend": "local",
          "project": "qwen3"
        },
        "agfs": {
          "backend": "local",
          "timeout": 10
        }
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "max_concurrent": 4,
        "max_retries": 3,
        "max_input_tokens": 4096,
        "dense": {
          "provider": "ollama",
          "api_base": "http://ollama-mole.openviking.svc.cluster.local:11434/v1",
          "model": "qwen3-embedding:4b",
          "dimension": 2560,
          "input": "text"
        }
      },
      "vlm": {
        "provider": "openai-codex",
        "model": "gpt-5.5",
        "temperature": 0.0,
        "timeout": 90,
        "max_tokens": 1024,
        "max_concurrent": 2
      },
      "query_planner": {
        "provider": "litellm",
        "model": "ollama/guoxuter/ov_intent_analysis_sft:v7_q8",
        "api_key": "no-key",
        "api_base": "http://ollama-rocm.ollama-rocm.svc.cluster.local:11434",
        "temperature": 0.0,
        "timeout": 45,
        "max_tokens": 256,
        "max_concurrent": 1,
        "extra_request_body": {
          "think": false,
          "options": {
            "num_ctx": 4096,
            "num_predict": 256
          }
        }
      }
    }
