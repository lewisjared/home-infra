---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: openviking
data:
  ov.conf: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 1,
        "auth_mode": "api_key",
        "root_api_key": "__OPENVIKING_ROOT_API_KEY__",
        "cors_origins": ["https://openviking.home.lewelly.com"]
      },
      "storage": {
        "workspace": "/app/.openviking/openviking_workspace",
        "vectordb": {
          "name": "context",
          "backend": "local",
          "project": "default"
        },
        "agfs": {
          "backend": "local",
          "timeout": 10
        }
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "max_concurrent": 2,
        "max_retries": 3,
        "max_input_tokens": 2048,
        "dense": {
          "provider": "ollama",
          "api_base": "http://ollama.ollama.svc.cluster.local:11434/v1",
          "model": "nomic-embed-text",
          "dimension": 768,
          "input": "text"
        }
      },
      "vlm": {
        "provider": "litellm",
        "model": "ollama/qwen3:1.7b",
        "api_key": "no-key",
        "api_base": "http://ollama-rocm.ollama-rocm.svc.cluster.local:11434",
        "temperature": 0.0,
        "timeout": 90,
        "max_tokens": 256,
        "extra_request_body": {
          "think": false
        }
      },
      "query_planner": {
        "provider": "litellm",
        "model": "ollama/qwen3:1.7b",
        "api_key": "no-key",
        "api_base": "http://ollama-rocm.ollama-rocm.svc.cluster.local:11434",
        "temperature": 0.0,
        "timeout": 90,
        "max_tokens": 256,
        "extra_request_body": {
          "think": false
        }
      }
    }
