---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: openviking
data:
  ov.conf: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "workers": 1,
        "root_api_key": null,
        "cors_origins": ["https://openviking.home.lewelly.com"]
      },
      "storage": {
        "workspace": "/app/.openviking/openviking_workspace",
        "vectordb": {
          "name": "context",
          "backend": "local",
          "project": "default"
        },
        "agfs": {
          "backend": "local",
          "timeout": 10
        }
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      }
    }
