---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openviking
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/openviking
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
    - name: storage
    - name: security
    - name: ollama-mole
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  components:
    - ../../../../components/alerts
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: openviking
      # Must match the app-template PVC name (release name), not a guessed
      # suffix; the RWO PVC is `openviking`. A mismatch leaves volsync erroring
      # with "PersistentVolumeClaim not found" and never backing up.
      VOLSYNC_CLAIM: openviking
