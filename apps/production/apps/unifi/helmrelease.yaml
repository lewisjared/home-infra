---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
  namespace: unifi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      main:
        strategy: Recreate
        initContainers:
          # Native sidecar, so MongoDB is accepting connections before UniFi's init script gives up on it.
          mongo:
            image:
              repository: docker.io/library/mongo
              tag: 8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
            restartPolicy: Always
            env:
              MONGO_INITDB_ROOT_USERNAME: unifi
              MONGO_INITDB_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: unifi-secret
                    key: MONGO_PASS
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 27017
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsUser: 3000
              runAsGroup: 3000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/unifi-network-application
              tag: 10.6.109@sha256:8389f585c6443af7051b4696a09e4bb5408636da7f99c5a0e5a883595c1d434c
            env:
              TZ: Australia/Melbourne
              PUID: 3000
              PGID: 3000
              MEM_LIMIT: 1024
              MONGO_HOST: localhost
              MONGO_PORT: 27017
              MONGO_DBNAME: unifi
              MONGO_AUTHSOURCE: admin
              MONGO_USER: unifi
              MONGO_PASS:
                valueFrom:
                  secretKeyRef:
                    name: unifi-secret
                    key: MONGO_PASS
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: &port 8443
                    scheme: HTTPS
                  periodSeconds: 10
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: *port
                    scheme: HTTPS
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 2Gi
            # s6-overlay starts as root and drops to PUID/PGID.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETUID
                  - SETGID

    service:
      main:
        controller: main
        ports:
          https:
            port: *port
      devices:
        controller: main
        type: LoadBalancer
        annotations:
          # Devices are told this address via set-inform, so it must not change.
          io.cilium/lb-ipam-ips: 10.10.20.210
        ports:
          https:
            port: *port
          inform:
            port: 8080
          stun:
            port: 3478
            protocol: UDP
          discovery:
            port: 10001
            protocol: UDP
          speedtest:
            port: 6789

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: rook-ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          main:
            main:
              - path: /config
                subPath: unifi
            mongo:
              - path: /data/db
                subPath: mongo
      mongo-configdb:
        type: emptyDir
        advancedMounts:
          main:
            mongo:
              - path: /data/configdb
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
