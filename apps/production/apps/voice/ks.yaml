---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: voice
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/voice
  prune: true
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
    - name: home-assistant
  components:
    - ../../../../components/alerts
  postBuild:
    substitute:
      APP: voice
