---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ref-weekly-reset
  namespace: climate-ref
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: ref-weekly-reset
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Scales api + orchestrator to 0 so they release their NFS file
            # handles on the SQLite DB, then copies kubectl into a shared
            # volume so the main container can scale them back up after the
            # reset completes.
            - name: scale-down
              image: alpine/k8s:1.36.0@sha256:c105e4eaa265c617e43be34fffc7d9961de76b65a1e520179ed61e2f3a9fabf7
              command:
                - sh
                - -c
                - |
                  set -eu
                  echo "=== Scaling climate-ref-api + climate-ref-orchestrator to 0 ==="
                  kubectl -n climate-ref scale deploy climate-ref-api climate-ref-orchestrator --replicas=0

                  echo "=== Waiting for api + orchestrator pods to terminate ==="
                  for i in $(seq 1 60); do
                    count=$(kubectl -n climate-ref get pod \
                      -l 'app.kubernetes.io/component in (api,orchestrator)' \
                      --no-headers 2>/dev/null | wc -l)
                    if [ "$count" -eq 0 ]; then
                      echo "All pods terminated"
                      break
                    fi
                    echo "[$i/60] $count pod(s) still running"
                    sleep 5
                  done

                  echo "=== Installing kubectl into /kubectl for the main container ==="
                  cp /usr/bin/kubectl /kubectl/kubectl
                  chmod 755 /kubectl/kubectl
              volumeMounts:
                - name: kubectl
                  mountPath: /kubectl
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: ref-weekly-reset
              image: ghcr.io/climate-ref/climate-ref:v0.13.2@sha256:a1b2f2217afc610eaccd1a2577ed52cdbb1b7ba0dc1bddfbc18f00825d00c255
              command:
                - sh
                - /scripts/run-weekly-reset.sh
              env:
                - name: REF_CONFIGURATION
                  value: /ref/home_2026-05-11
                - name: REF_SOFTWARE_ROOT
                  value: /ref/software
                - name: HOME
                  value: /tmp
                - name: PATH
                  value: /kubectl:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              volumeMounts:
                - name: ref-data
                  mountPath: /ref
                - name: cmip6-data
                  mountPath: /data/cmip6
                - name: obs-data
                  mountPath: /data/obs
                - name: tmp
                  mountPath: /tmp
                - name: scripts
                  mountPath: /scripts
                - name: kubectl
                  mountPath: /kubectl
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: ref-data
              persistentVolumeClaim:
                claimName: climate-ref-state-csi
            - name: cmip6-data
              persistentVolumeClaim:
                claimName: climate-ref-cmip6-csi
            - name: obs-data
              persistentVolumeClaim:
                claimName: climate-ref-obs-csi
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap:
                name: ref-job-scripts
                defaultMode: 0755
            - name: kubectl
              emptyDir: {}
