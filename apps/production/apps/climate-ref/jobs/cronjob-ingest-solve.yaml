---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ref-ingest-solve
  namespace: climate-ref
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ref-ingest-solve
              image: ghcr.io/climate-ref/climate-ref:v0.14.2@sha256:66db214b4303626d922832308805039999006bfb1f41161a6e00c54f2a4c590f
              command:
                - sh
                - /scripts/run-ingest-solve.sh
              envFrom:
                - secretRef:
                    name: climate-ref-orchestrator
              env:
                - name: REF_CONFIGURATION
                  value: /ref/home_2026-05-11
                - name: REF_SOFTWARE_ROOT
                  value: /ref/software
                - name: HOME
                  value: /tmp
                # Path-based DRS parser is dramatically faster than the
                # content-based `complete` parser on a 60k+ file CMIP6 tree
                # because it never opens netCDF files. Keep it aligned with
                # the api/worker defaults in helmrelease.yaml.
                - name: REF_CMIP6_PARSER
                  value: drs
                # Persist pooch downloads (provider reference data) across
                # cron runs. See helmrelease.yaml defaults.env for context.
                - name: XDG_CACHE_HOME
                  value: /data/obs/cache
              volumeMounts:
                - name: ref-data
                  mountPath: /ref
                - name: cmip6-data
                  mountPath: /data/cmip6
                - name: obs-data
                  mountPath: /data/obs
                - name: tmp
                  mountPath: /tmp
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: 2Gi
                  cpu: 500m
                limits:
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: ref-data
              persistentVolumeClaim:
                claimName: climate-ref-state-csi
            - name: cmip6-data
              persistentVolumeClaim:
                claimName: climate-ref-cmip6-csi
            - name: obs-data
              persistentVolumeClaim:
                claimName: climate-ref-obs-csi
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap:
                name: ref-job-scripts
                defaultMode: 0755
