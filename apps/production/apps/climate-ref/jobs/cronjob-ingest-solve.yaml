---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ref-ingest-solve
  namespace: climate-ref
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ref-ingest-solve
              image: ghcr.io/climate-ref/climate-ref:v0.13.2@sha256:a1b2f2217afc610eaccd1a2577ed52cdbb1b7ba0dc1bddfbc18f00825d00c255
              command:
                - sh
                - /scripts/run-ingest-solve.sh
              env:
                - name: REF_CONFIGURATION
                  value: /ref/home_2026-05-11
                - name: REF_SOFTWARE_ROOT
                  value: /ref/software
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: ref-data
                  mountPath: /ref
                - name: cmip6-data
                  mountPath: /data/cmip6
                - name: obs-data
                  mountPath: /data/obs
                - name: tmp
                  mountPath: /tmp
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: ref-data
              persistentVolumeClaim:
                claimName: climate-ref-state-csi
            - name: cmip6-data
              persistentVolumeClaim:
                claimName: climate-ref-cmip6-csi
            - name: obs-data
              persistentVolumeClaim:
                claimName: climate-ref-obs-csi
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap:
                name: ref-job-scripts
                defaultMode: 0755
