---
# RBAC for the weekly-reset CronJob.
#
# The reset has to wipe /ref/test-lazy on the state PVC, but the live api +
# orchestrator hold open file handles on the SQLite database. On NFS that
# turns the unlink into a silly-rename (.nfsXXX) which `rm -rf` can't remove,
# so the wipe phase fails. The cron scales api + orchestrator to 0 before
# wiping and back to 1 after re-init.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ref-weekly-reset
  namespace: climate-ref
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ref-weekly-reset
  namespace: climate-ref
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - climate-ref-api
      - climate-ref-orchestrator
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames:
      - climate-ref-api
      - climate-ref-orchestrator
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ref-weekly-reset
  namespace: climate-ref
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ref-weekly-reset
subjects:
  - kind: ServiceAccount
    name: ref-weekly-reset
    namespace: climate-ref
