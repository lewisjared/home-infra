---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: climate-ref-esmvaltool
  namespace: climate-ref
spec:
  scaleTargetRef:
    name: climate-ref-esmvaltool
  minReplicaCount: 0
  maxReplicaCount: 2
  # Long cooldown so a transient queue=0 dip — workers pulled the last batch
  # but tasks are still running, before flower's currently-executing metric
  # has been re-scraped — does not trip a scale-down mid-execution.
  cooldownPeriod: 1800
  pollingInterval: 15
  triggers:
    - type: redis
      metadata:
        address: climate-ref-dragonfly.climate-ref.svc:6379
        listName: esmvaltool
        listLength: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-prometheus.monitoring.svc:9090
        query: sum(flower_worker_number_of_currently_executing_tasks{namespace="climate-ref", provider="esmvaltool"})
        threshold: "1"
