---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: climate-ref-state-csi
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: climate-ref-state-csi
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - nconnect=8
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 10.10.30.20#mnt/fast/climate-ref#climate-ref-state
    volumeAttributes:
      server: 10.10.30.20
      share: /mnt/fast/climate-ref
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: climate-ref-state-csi
  namespace: climate-ref
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: climate-ref-state-csi
  volumeName: climate-ref-state-csi
  resources:
    requests:
      storage: 50Gi
