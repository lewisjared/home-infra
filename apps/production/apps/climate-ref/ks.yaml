---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: climate-ref
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/climate-ref
  prune: true
  wait: true
  # Above the HelmRelease timeout, so its health check outlasts the first multi-GB image pull.
  timeout: 25m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  components:
    - ../../../../components/alerts
  postBuild:
    substitute:
      APP: climate-ref
      # Grafana dashboard JSON refers to the Prometheus datasource by UID.
      datasource: prometheus
