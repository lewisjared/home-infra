---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: climate-ref
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/climate-ref
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
    - name: storage
    - name: database-clusters
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  components:
    - ../../../../components/alerts
  postBuild:
    substitute:
      APP: climate-ref
      # Single source-of-truth for the climate-ref container image
      # tag+digest. Referenced from helmrelease.yaml defaults.image.tag
      # and both jobs/cronjob-*.yaml manifests so bumps are one-line.
      CLIMATE_REF_IMAGE_TAG: v0.14.3@sha256:770f9f1e3b05a5a4b70fabb0a50bdf2b686ad7994afb5f1a93fb7e419922bea2
