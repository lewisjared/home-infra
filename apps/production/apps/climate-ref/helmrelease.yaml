---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: climate-ref
  namespace: climate-ref
spec:
  interval: 1h
  url: oci://ghcr.io/climate-ref/charts/climate-ref-aft
  ref:
    tag: 0.1.0_pr-7
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: climate-ref
  namespace: climate-ref
spec:
  releaseName: climate-ref
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: climate-ref
    namespace: climate-ref
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    # Preserve resource naming from the original "ref" chart
    nameOverride: "ref"

    api:
      env:
        ENVIRONMENT: production
        HOME: /tmp
        SECRET_KEY: Slbc926qO9VmHJMLzXTjnbK19el5PqCcwhHg1LGe0eQ # Not used, but must not be "changethis"
        REF_CONFIGURATION: /ref/test-lazy
        # TODO(Climate-REF/ref-app#29): re-enable once provider.configure()
        # stops writing to the DB at startup.
        # REF_READ_ONLY_DATABASE: "true"
      httpRoute:
        enabled: true
        hostnames:
          - climate-ref.home.lewelly.com
          - api.climate-ref.home.lewelly.com
        parentRefs:
          - name: home-gateway
            namespace: traefik
            sectionName: websecure
        filters:
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: authelia-forwardauth
        annotations:
          external-dns.alpha.kubernetes.io/hostname: climate-ref.home.lewelly.com
      # Frontend image ships USER "app" (non-numeric); kubelet can't verify
      # non-root without an explicit runAsUser.
      podSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 2Gi
      volumes:
        - name: ref-data
          persistentVolumeClaim:
            claimName: climate-ref-state-csi
        - name: tmp
          emptyDir: {}
      volumeMounts:
        # TODO(Climate-REF/ref-app#29): restore readOnly once provider.configure()
        # stops writing to the DB at startup.
        - name: ref-data
          mountPath: /ref
        - name: tmp
          mountPath: /tmp

    # Global worker configuration
    defaults:
      env:
        COLUMNS: "160"
        HOME: /tmp
        REF_CONFIGURATION: /ref/test-lazy
        REF_CMIP6_PARSER: drs
      # Persistent NFS volumes for CMIP6 data, observations, and REF state
      volumes:
        - name: ref-data
          persistentVolumeClaim:
            claimName: climate-ref-state-csi
        - name: cmip6-data
          persistentVolumeClaim:
            claimName: climate-ref-cmip6-csi
        - name: obs-data
          persistentVolumeClaim:
            claimName: climate-ref-obs-csi
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: esmvaltool-config
          configMap:
            name: climate-ref-esmvaltool-config
      volumeMounts:
        - name: ref-data
          mountPath: /ref
        - name: cmip6-data
          mountPath: /data/cmip6
        - name: obs-data
          mountPath: /data/obs
        - name: tmp
          mountPath: /tmp

    # Flower (Celery monitoring UI) configuration
    flower:
      env:
        FLOWER_UNAUTHENTICATED_API: "true"
        FLOWER_TASK_RUNTIME_METRIC_BUCKETS: "30,60,120,180,300,450,600,900,1200,1800"
      httpRoute:
        enabled: true
        hostnames:
          - flower.climate-ref.home.lewelly.com
        parentRefs:
          - name: home-gateway
            namespace: traefik
            sectionName: websecure
        filters:
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: authelia-forwardauth
        annotations:
          external-dns.alpha.kubernetes.io/hostname: flower.climate-ref.home.lewelly.com

    # Dragonfly configuration (Celery broker and result backend)
    dragonfly:
      enabled: true
      storage:
        enabled: true
      extraArgs:
        - --proactor_threads=1
        - --maxmemory=1Gi

    # Provider configurations
    providers:
      orchestrator:
        env:
          CELERY_WORKER_CONCURRENCY: "1"
      esmvaltool:
        replicaCount: 4
        resources:
          requests:
            memory: 16Gi
            cpu: "4"
        env:
          CELERY_WORKER_CONCURRENCY: "2"
          CELERY_TASK_TIME_LIMIT: "21600" # 6 hours
          CELERY_TASK_SOFT_TIME_LIMIT: "19800" # 5.5 hours
          CELERY_VISIBILITY_TIMEOUT: "21600"
          CELERY_WORKER_MAX_MEMORY_PER_CHILD: "16000000" # 16 GB (KB) - recycle before OOM
          CELERY_WORKER_MAX_TASKS_PER_CHILD: "20" # Recycle after 20 tasks (long-running)
      pmp:
        replicaCount: 4
        resources:
          requests:
            memory: 8Gi
            cpu: "4"
        env:
          CELERY_WORKER_CONCURRENCY: "2"
          CELERY_TASK_TIME_LIMIT: "7200" # 2 hours
          CELERY_TASK_SOFT_TIME_LIMIT: "6600" # 1 hour 50 min
          CELERY_VISIBILITY_TIMEOUT: "7200"
          CELERY_WORKER_MAX_MEMORY_PER_CHILD: "6291456" # 6 GB (KB)
          CELERY_WORKER_MAX_TASKS_PER_CHILD: "20" # Recycle after 20 tasks (long-running)
          # Use synchronous Dask scheduler to avoid crashes from excessive
          # parallelism when running multiple executions on the same machine.
          # See: https://github.com/Climate-REF/climate-ref/issues/437
          DASK_SCHEDULER: synchronous
      ilamb:
        replicaCount: 2
        resources:
          requests:
            memory: 8Gi
            cpu: "4"
        env:
          CELERY_WORKER_CONCURRENCY: "2"
          CELERY_TASK_TIME_LIMIT: "1800" # 30 minutes
          CELERY_TASK_SOFT_TIME_LIMIT: "1500" # 25 minutes
          CELERY_VISIBILITY_TIMEOUT: "1800"
          CELERY_WORKER_MAX_MEMORY_PER_CHILD: "6291456" # 6 GB (KB)
          CELERY_WORKER_MAX_TASKS_PER_CHILD: "50" # Recycle after 50 tasks
          # Use synchronous Dask scheduler to avoid crashes from excessive
          # parallelism when running multiple executions on the same machine.
          # See: https://github.com/Climate-REF/climate-ref/issues/437
          DASK_SCHEDULER: synchronous
