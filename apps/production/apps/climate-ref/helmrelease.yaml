---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: climate-ref
  namespace: climate-ref
spec:
  interval: 1h
  url: oci://ghcr.io/climate-ref/charts/climate-ref-aft
  ref:
    tag: 0.7.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: climate-ref
  namespace: climate-ref
spec:
  releaseName: climate-ref
  interval: 30m
  # The first install pulls the multi-GB worker image on every node a worker lands on.
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: climate-ref
    namespace: climate-ref
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    cleanupOnFail: true
  values:
    # Resources are named climate-ref-<component>, which testbed.sh and the dashboard rely on.
    nameOverride: ref

    api:
      httpRoute:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: climate-ref.home.lewelly.com
        hostnames:
          - climate-ref.home.lewelly.com
          - api.climate-ref.home.lewelly.com
        parentRefs: &parentRefs
          - name: home-gateway
            namespace: traefik
            sectionName: websecure
        filters: &authelia
          - type: ExtensionRef
            extensionRef:
              group: traefik.io
              kind: Middleware
              name: authelia-forwardauth
      volumes: &volumes
        - name: ref
          persistentVolumeClaim:
            claimName: climate-ref-state-csi
        - name: cmip6
          persistentVolumeClaim:
            claimName: climate-ref-cmip6-csi
        - name: obs
          persistentVolumeClaim:
            claimName: climate-ref-obs-csi
        - name: tmp
          emptyDir: {}
      volumeMounts:
        - name: ref
          mountPath: /ref
          readOnly: true
        - name: ref
          mountPath: /ref/db
          subPath: db
        - name: tmp
          mountPath: /tmp

    defaults:
      env:
        # The DRS parser reads metadata from the path, so a 60k file archive ingests in minutes.
        REF_CMIP6_PARSER: drs
      volumes: *volumes
      volumeMounts:
        - &refMount
          name: ref
          mountPath: /ref
        - &cmip6Mount
          name: cmip6
          mountPath: /data/cmip6
          readOnly: true
        - name: obs
          mountPath: /data/obs
          readOnly: true
        - &tmpMount
          name: tmp
          mountPath: /tmp

    # Writes obs4REF to the obs volume during bootstrap, which the workers only read.
    orchestrator:
      volumeMounts:
        - *refMount
        - *cmip6Mount
        - name: obs
          mountPath: /data/obs
        - *tmpMount

    providers:
      esmvaltool:
        keda: &keda
          enabled: true
          maxReplicaCount: 2
          # runningTasks holds a busy worker up, so the cooldown only bridges the Flower scrape gap.
          cooldownPeriod: 300
          runningTasks:
            enabled: true
            serverAddress: http://prometheus-prometheus.monitoring.svc:9090
      pmp:
        keda: *keda
      ilamb:
        keda: *keda

    dragonfly:
      # Queues are rebuilt by the next solve, so the broker needs no volume.
      storage:
        enabled: false
      serviceMonitor:
        enabled: true
        interval: 30s
      # Dragonfly needs 256MiB of maxmemory per io thread, so one thread fits the small limit.
      extraArgs:
        - --proactor_threads=1
        - --maxmemory=1Gi
      resources:
        requests:
          cpu: 100m
          memory: 1536Mi
        limits:
          cpu: 1
          memory: 1536Mi

    flower:
      env:
        FLOWER_TASK_RUNTIME_METRIC_BUCKETS: "30,60,120,180,300,450,600,900,1200,1800"
        # A worker scaled in mid-task otherwise reports its last busy count forever and pins a KEDA replica.
        FLOWER_PURGE_OFFLINE_WORKERS: "300"
      serviceMonitor:
        enabled: true
      httpRoute:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: flower.climate-ref.home.lewelly.com
        hostnames:
          - flower.climate-ref.home.lewelly.com
        parentRefs: *parentRefs
        filters: *authelia
