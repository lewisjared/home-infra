apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: date-jar-secrets
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/date-jar/secrets
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
    - name: security
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
