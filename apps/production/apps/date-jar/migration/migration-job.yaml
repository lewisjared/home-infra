apiVersion: batch/v1
kind: Job
metadata:
  # Jobs are immutable, so the first v0.1.0 run (which failed on the grant.mjs
  # module-resolution bug) cannot be re-run in place. Bumping the name lets Flux
  # prune the failed Job and create a fresh one with the fixed grant script.
  name: date-jar-migration-v0-1-0-r2
  namespace: date-jar
  labels:
    app.kubernetes.io/name: date-jar
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: date-jar
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ghcr.io/lewisjared/date-jar:v0.1.0@sha256:0ad5d47e5413b43163300d82354faccbde975d661560e0be302cc3a157a02b96
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - node scripts/migrate.mjs && node /opt/date-jar/grant.mjs
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: date-jar-migrator-password
                  key: DATABASE_URL
            - name: DATABASE_SSL
              value: "false"
          volumeMounts:
            - name: runtime-grants
              mountPath: /opt/date-jar
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: runtime-grants
          configMap:
            name: date-jar-runtime-grants
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
