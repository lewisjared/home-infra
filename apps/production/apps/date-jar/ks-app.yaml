apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: date-jar
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/date-jar/app
  prune: true
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: date-jar-migration
    - name: core
    - name: security
