apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: date-jar
  namespace: date-jar
spec:
  interval: 1h
  timeout: 10m0s
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/lewisjared/date-jar
              # TODO: pin the v0.2.0 digest once the forward-auth app image is
              # published (see date-jar PR feat/authelia-forward-auth). Must land
              # together with the Authelia forward-auth changes in this PR — the
              # v0.1.0 image still runs its own next-auth OIDC flow.
              tag: v0.2.0@sha256:REPLACE_WITH_PUBLISHED_DIGEST
              pullPolicy: IfNotPresent
            env:
              NODE_ENV: production
              # Auth is enforced upstream by Traefik -> Authelia forward-auth,
              # which injects Remote-User/Remote-Groups. AUTH_URL is retained for
              # the app's same-origin (CSRF) check on cookie-authenticated writes.
              AUTH_URL: https://date-jar.home.lewelly.com
              AGENT_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: date-jar-secrets
                    key: AGENT_API_TOKEN
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: date-jar-secrets
                    key: DATABASE_URL
              # Intentional internal-cluster choice: CNPG traffic stays plaintext;
              # the namespace egress policy restricts this to postgres pods only.
              DATABASE_SSL: "false"
              DB_POOL_SIZE: "5"
              DEV_AUTH_BYPASS: "false"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: &port 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
