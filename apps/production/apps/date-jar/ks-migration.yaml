apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: date-jar-migration
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/date-jar/migration
  prune: true
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: date-jar-secrets
    - name: database-clusters
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
