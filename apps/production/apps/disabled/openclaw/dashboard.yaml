---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: openclaw
  namespace: openclaw
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  allowCrossNamespaceImport: true
  json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Health",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "title": "Status",
          "type": "stat",
          "targets": [
            { "expr": "kube_deployment_status_replicas_available{namespace=\"openclaw\", deployment=\"openclaw\"}", "legendFormat": "Available" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 3 }, { "color": "red", "value": 5 }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "title": "Restarts",
          "type": "stat",
          "targets": [
            { "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"openclaw\", container=\"main\"})", "legendFormat": "Restarts" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "title": "Uptime",
          "type": "stat",
          "targets": [
            { "expr": "time() - max(kube_pod_start_time{namespace=\"openclaw\"})", "legendFormat": "Uptime" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 }] }
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 5,
          "title": "PVC Usage",
          "type": "stat",
          "targets": [
            { "expr": "kubelet_volume_stats_used_bytes{namespace=\"openclaw\"} / kubelet_volume_stats_capacity_bytes{namespace=\"openclaw\"}", "legendFormat": "Used" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 10,
          "title": "Resources",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "fillOpacity": 20 } }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 11,
          "title": "Memory Usage",
          "type": "timeseries",
          "targets": [
            { "expr": "container_memory_working_set_bytes{namespace=\"openclaw\", container=\"main\"}", "legendFormat": "Working Set" },
            { "expr": "container_memory_rss{namespace=\"openclaw\", container=\"main\"}", "legendFormat": "RSS" },
            { "expr": "kube_pod_container_resource_limits{namespace=\"openclaw\", container=\"main\", resource=\"memory\"}", "legendFormat": "Limit" },
            { "expr": "kube_pod_container_resource_requests{namespace=\"openclaw\", container=\"main\", resource=\"memory\"}", "legendFormat": "Request" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "fillOpacity": 20 } }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 12,
          "title": "CPU Usage",
          "type": "timeseries",
          "targets": [
            { "expr": "rate(container_cpu_usage_seconds_total{namespace=\"openclaw\", container=\"main\"}[5m])", "legendFormat": "Usage (cores)" },
            { "expr": "kube_pod_container_resource_requests{namespace=\"openclaw\", container=\"main\", resource=\"cpu\"}", "legendFormat": "Request" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "Bps", "custom": { "fillOpacity": 20 } }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "id": 13,
          "title": "Network I/O",
          "type": "timeseries",
          "targets": [
            { "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"openclaw\"}[5m]))", "legendFormat": "Received" },
            { "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"openclaw\"}[5m]))", "legendFormat": "Transmitted" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "fillOpacity": 20 } }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "id": 14,
          "title": "PVC Usage Over Time",
          "type": "timeseries",
          "targets": [
            { "expr": "kubelet_volume_stats_used_bytes{namespace=\"openclaw\"}", "legendFormat": "Used" },
            { "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"openclaw\"}", "legendFormat": "Capacity" }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 20,
          "title": "Logs",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 23 },
          "id": 21,
          "title": "Application Logs",
          "type": "logs",
          "targets": [
            { "expr": "{namespace=\"openclaw\", container=\"main\"}", "refId": "A" }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "wrapLogMessage": true
          }
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 33 },
          "id": 22,
          "title": "Errors & Warnings",
          "type": "timeseries",
          "targets": [
            { "expr": "sum(rate({namespace=\"openclaw\", container=\"main\"} |= \"error\" [5m]))", "legendFormat": "Errors" },
            { "expr": "sum(rate({namespace=\"openclaw\", container=\"main\"} |= \"warn\" [5m]))", "legendFormat": "Warnings" }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["openclaw", "ai-agent"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "prometheus" },
            "hide": 0,
            "includeAll": false,
            "label": "Data Source",
            "name": "datasource",
            "query": "prometheus",
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "title": "OpenClaw",
      "uid": "openclaw-overview"
    }
