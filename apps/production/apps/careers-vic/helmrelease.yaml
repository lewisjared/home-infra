---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: careers-vic
  namespace: careers-vic
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      main:
        # RWO volume, and the weekly refresh runs in this pod, so only ever one replica.
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/lewisjared/careers-vic
              tag: sha-dbc501fb7df7889b5e4ba77cf04b5837891b800d@sha256:18d5dcf407c817a7b018ef2e0eb14058f8af13e2bed8f60e2e876d3d1e79c8b9
            env:
              TZ: Australia/Melbourne
              PORT: &port 8080
              CAREERS_VIC_MODEL: haiku
            envFrom:
              - secretRef:
                  name: careers-vic-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    persistence:
      # Scrape cache, model-written notes and the built site. All rebuildable, so no VolSync backup.
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: rook-ceph-block
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
