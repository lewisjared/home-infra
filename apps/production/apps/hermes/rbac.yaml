---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: hermes
---
# Cluster-wide diagnostics for the Hermes agent.
#
# This is intentionally broad enough for kubectl/Flux-style troubleshooting
# across the cluster, but it is not cluster-admin:
# - no Kubernetes Secret read/list/watch access
# - no workload/resource mutation permissions
# - only debug subresources (exec/attach/portforward) require create
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-diagnostics
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - pods/status
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/attach
      - pods/exec
      - pods/portforward
    verbs:
      - create
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - batch
      - cert-manager.io
      - acme.cert-manager.io
      - ceph.rook.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - gateway.networking.k8s.io
      - helm.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - keda.sh
      - kustomize.toolkit.fluxcd.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - networking.k8s.io
      - node.k8s.io
      - notification.toolkit.fluxcd.io
      - policy
      - postgresql.cnpg.io
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - traefik.io
      - volsync.backube
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - nonResourceURLs:
      - /healthz
      - /livez
      - /metrics
      - /readyz
      - /version
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-diagnostics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-diagnostics
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
