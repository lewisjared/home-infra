---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/hermes
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  components:
    - ../../../../components/volsync
    - ../../../../components/alerts
  postBuild:
    substitute:
      APP: hermes
      VOLSYNC_CLAIM: hermes-config
      # Match HERMES_UID/HERMES_GID so the kopia mover can read the PVC files.
      VOLSYNC_PUID: "10000"
      VOLSYNC_PGID: "10000"
