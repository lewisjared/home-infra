---
# Flux image automation: watches ghcr.io for new main-branch builds and
# commits tag bumps to deploy/production/trading-engine.yaml so the
# cluster rolls to the newest image without human intervention.
#
# Requires the image-reflector-controller and image-automation-controller
# to be installed in flux-system (home-infra repo owns that).
#
# Authentication:
#   - Registry read: expects a dockerconfigjson secret named
#     `ghcr-pull-secret` in flux-system. Managed in home-infra.
#   - Git write: reuses the existing `flux-system` secret attached to
#     the vela GitRepository (must have write scope on lewisjared/vela).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vela-engine
  namespace: flux-system
spec:
  image: ghcr.io/lewisjared/vela-engine
  interval: 5m
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vela-engine
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: vela-engine
  filterTags:
    # Matches the main-build tag scheme produced by docker-build.yml:
    # <unix_timestamp>-<sha7>, e.g. 1712974507-aa6ea7f.
    pattern: "^(?P<ts>[0-9]+)-[0-9a-f]{7}$"
    extract: "$ts"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vela-api
  namespace: flux-system
spec:
  image: ghcr.io/lewisjared/vela-api
  interval: 5m
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vela-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: vela-api
  filterTags:
    # Matches the main-build tag scheme produced by
    # docker-build-api.yml: <unix_timestamp>-<sha7>.
    pattern: "^(?P<ts>[0-9]+)-[0-9a-f]{7}$"
    extract: "$ts"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: vela
  namespace: flux-system
spec:
  # 5m interval batches vela-engine + vela-api bumps into a single
  # commit when both images build from the same merge.
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: vela
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(deploy): bump to {{range .Changed.Changes}}{{println .NewValue}}{{end}}
    push:
      branch: main
  update:
    path: ./deploy/production
    strategy: Setters
