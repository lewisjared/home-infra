---
# Flux image automation: watches ghcr.io for new main-branch builds and
# commits tag bumps into deploy/production/*.yaml so the cluster rolls to
# the newest image without human intervention.
#
# The API and the trading engine ship as a single ghcr.io/lewisjared/vela
# image, so this is one ImageRepository/ImagePolicy pair. Every image marker
# in the vela repo (api, cronjobs, seed job, and the VELA_API_IMAGE_TAG env)
# references the same `flux-system:vela` policy, so one reconcile bumps them
# all atomically — the tag streams can no longer skew.
#
# Requires the image-reflector-controller and image-automation-controller
# to be installed in flux-system (home-infra repo owns that).
#
# Authentication:
#   - Registry read: expects a dockerconfigjson secret named
#     `ghcr-pull-secret` in flux-system. Managed in home-infra.
#   - Git write: reuses the existing `flux-system` secret attached to
#     the vela GitRepository (must have write scope on lewisjared/vela).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vela
  namespace: flux-system
spec:
  image: ghcr.io/lewisjared/vela
  interval: 5m
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vela
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: vela
  filterTags:
    # Matches the main-build tag scheme produced by docker-build.yml:
    # <unix_timestamp>-<sha7>, e.g. 1712974507-aa6ea7f.
    pattern: "^(?P<ts>[0-9]+)-[0-9a-f]{7}$"
    extract: "$ts"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: vela
  namespace: flux-system
spec:
  # 5m interval batches every vela marker bump into a single commit.
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: vela
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      # [skip ci] makes GitHub Actions skip push-triggered workflows
      # on this commit.
      # That avoids a wasted CI run on every bump,
      # and stops the bump push from cancelling the merge commit's
      # in-progress CI
      # (ci.yml uses cancel-in-progress keyed on the branch ref).
      messageTemplate: |
        chore(deploy): bump vela images [skip ci]

        {{range .Changed.Changes}}- {{.NewValue}}
        {{end}}
    push:
      branch: main
  update:
    path: ./deploy/production
    strategy: Setters
