---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vela
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: vela
  path: ./deploy/production
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: database
    - name: core
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
