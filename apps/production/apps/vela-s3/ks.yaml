---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vela-s3
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/vela-s3
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
