---
apiVersion: v1
kind: Namespace
metadata:
  name: binderhub
  labels:
    # JupyterHub singleuser images typically run as root before sudo'ing
    # to jovyan, which `restricted` disallows. `baseline` still permits
    # root-in-container while blocking hostPath / privileged escalation
    # / host namespaces. (The original `privileged` was for BinderHub's
    # dind builder, which we no longer run.)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
