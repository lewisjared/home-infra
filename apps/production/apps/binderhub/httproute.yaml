---
# Public-facing HTTPRoute on the HTTP listener.
# Cloudflare terminates TLS at the edge (Flexible mode); origin is HTTP.
# DNS for binder.climate-ref.org is managed manually in Cloudflare,
# NOT by external-dns (which is scoped to home.lewelly.com).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: binderhub
  namespace: binderhub
spec:
  parentRefs:
    - name: home-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - binder.climate-ref.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: binder
          port: 80
