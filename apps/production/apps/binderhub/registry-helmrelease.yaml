---
# In-cluster Docker registry. BinderHub pushes built repo2docker images here
# and pulls them back when spawning user sessions. Only reachable inside the
# cluster (no Service of type LoadBalancer or HTTPRoute).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry
  namespace: binderhub
spec:
  releaseName: registry
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: docker-registry
      version: "3.0.0"
      sourceRef:
        kind: HelmRepository
        name: twuni
        namespace: binderhub
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: rook-ceph-block
      accessMode: ReadWriteOnce
    service:
      port: 5000
    # Enable image deletion so the weekly GC CronJob can reclaim space.
    configData:
      storage:
        delete:
          enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
---
# Weekly garbage-collect to reclaim layers from deleted/overwritten images.
# Without this the PVC fills indefinitely as climate-ref-tutorials gets new
# commits and BinderHub overwrites the tag for each commit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-gc
  namespace: binderhub
spec:
  schedule: "0 4 * * 0"  # Sundays 04:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: gc
              image: registry:3.0.0
              command:
                - /bin/registry
                - garbage-collect
                - --delete-untagged=true
                - /etc/docker/registry/config.yml
              volumeMounts:
                - name: data
                  mountPath: /var/lib/registry
                - name: config
                  mountPath: /etc/docker/registry
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: registry-docker-registry
            - name: config
              configMap:
                name: registry-docker-registry-config
