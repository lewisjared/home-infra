---
# Fills in container resource defaults so the namespace ResourceQuota
# (which enforces limits.cpu/memory + requests.cpu/memory)
# admits chart-managed pods that don't set every field explicitly (proxy/chp, hub, binder, etc.).
apiVersion: v1
kind: LimitRange
metadata:
  name: binderhub-defaults
  namespace: binderhub
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: "1"
        memory: 512Mi
