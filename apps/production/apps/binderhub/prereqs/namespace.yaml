---
apiVersion: v1
kind: Namespace
metadata:
  name: binderhub
  labels:
    # BinderHub's dind builder + image-cleaner need privileged + hostPath.
    # Drops PodSecurity from default `baseline` to `privileged` for this ns only.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
