---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.sops.yaml
  - limitrange.yaml
# Patch only the Secret into flux-system so the main Kustomization's
# substituteFrom (which reads from its own namespace) can find it.
# A top-level `namespace:` directive would also rename the Namespace
# resource, so this patch is scoped to the Secret.
#
# Namespace + LimitRange get `kustomize.toolkit.fluxcd.io/prune: disabled`
# in preparation for a follow-up PR that moves them into the main
# `binderhub` kustomization. The annotation makes them safe from
# `binderhub-prereqs`'s prune cycle once they're removed from this
# manifest set.
patches:
  - target:
      kind: Secret
      name: binderhub-secrets
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: flux-system
  - target:
      kind: Namespace
      name: binderhub
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: LimitRange
      name: binderhub-defaults
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
