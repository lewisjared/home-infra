---
# Public-facing jellyfin at jellyfin.lewelly.com via cloudflared lewelly tunnel + traefik public-gateway.
# Authelia one_factor enforced via forwardauth middleware (see ../middleware.yaml).
# Internal route at jellyfin.home.lewelly.com (see httproute.yaml) remains bypass for TV clients.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-public
  namespace: media
  labels:
    app.kubernetes.io/part-of: home-infra
    exposure: public
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - jellyfin.lewelly.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia-forwardauth
      backendRefs:
        - name: jellyfin
          port: 8096
