---
# Public-facing jellyfin at jellyfin.lewelly.com via cloudflared lewelly tunnel + traefik public-gateway.
# Authelia bypass (matches internal route): jellyfin web app sends
# `Authorization: MediaBrowser ...` which makes authelia forwardauth
# return 401 + WWW-Authenticate: Basic, triggering a browser native
# sign-in popup. Jellyfin's own auth handles access control.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-public
  namespace: media
  labels:
    app.kubernetes.io/part-of: home-infra
    exposure: public
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - jellyfin.lewelly.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096
