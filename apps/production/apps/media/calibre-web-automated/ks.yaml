---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calibre-web-automated
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/media/calibre-web-automated
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: media-shared
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  components:
    - ../../../../../components/volsync
    - ../../../../../components/alerts
  postBuild:
    substitute:
      APP: calibre-web-automated
