---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 3000
        runAsGroup: 3000
        runAsNonRoot: true
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              # The lite variant drops the bundled Chromium and calls flaresolverr instead.
              repository: ghcr.io/calibrain/shelfmark-lite
              tag: 1.3.11@sha256:f60b485796176f1247a63620a5719e18842ede5f1ef07394dec425872ecae981
            env:
              TZ: Australia/Melbourne
              FLASK_PORT: &port 8084
              CONFIG_DIR: /config
              TMP_DIR: /tmp/shelfmark
              LOG_ROOT: /var/log
              # Sits on the same NFS share the download clients write to, so the paths
              # they report resolve inside this container too.
              INGEST_DIR: /data/books
              USING_EXTERNAL_BYPASSER: "true"
              EXT_BYPASSER_URL: http://flaresolverr.media.svc.cluster.local:8191
              PROWLARR_URL: http://prowlarr.media.svc.cluster.local:9696
              QBITTORRENT_URL: http://qbittorrent.media.svc.cluster.local:8080
              SABNZBD_URL: http://sabnzbd.media.svc.cluster.local:8080
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: rook-ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /config
      data:
        existingClaim: media-library-csi
        globalMounts:
          - path: /data
      log:
        type: emptyDir
        globalMounts:
          - path: /var/log
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
