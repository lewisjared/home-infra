---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shelfmark
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/media/shelfmark
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: media-shared
  components:
    - ../../../../../components/volsync
    - ../../../../../components/alerts
  postBuild:
    substitute:
      APP: shelfmark
