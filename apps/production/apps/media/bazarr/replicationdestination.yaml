---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: bazarr-restore
  namespace: media
spec:
  trigger:
    manual: restore-once
  kopia:
    repository: volsync-secret
    sourceIdentity:
      sourceName: bazarr
      sourceNamespace: media
      sourcePath: /data
    copyMethod: Snapshot
    accessModes:
      - ReadWriteOnce
    capacity: 1Gi
    storageClassName: rook-ceph-block
    volumeSnapshotClassName: csi-ceph-blockpool
    moverSecurityContext:
      runAsUser: 3000
      runAsGroup: 3000
      fsGroup: 3000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            path: /mnt/tank/backups/k8s
            server: 10.10.20.20
