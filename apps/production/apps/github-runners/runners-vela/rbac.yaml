---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-vela-runner
  namespace: github-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-vela-preview-deployer
rules:
  # Namespace lifecycle for vela-pr-* preview environments
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Core resources within preview namespaces
  - apiGroups: [""]
    resources:
      [
        "pods",
        "services",
        "configmaps",
        "secrets",
        "persistentvolumeclaims",
        "serviceaccounts",
      ]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Workload resources
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CNPG PostgreSQL clusters
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares", "traefikservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API: preview workflow creates per-PR HTTPRoutes attached to
  # the shared home-gateway so external-dns publishes the DNS record.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cluster-scoped PVs so the preview workflow can attach a per-PR
  # read-only NFS PV with mountOptions (actimeo, nocto, large rsize)
  # for the catalog mount. Inline `nfs:` volumes can't carry these.
  # The PV is claimRef-pinned to the preview namespace's PVC and the
  # PR-close teardown removes it.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-vela-preview-deployer
subjects:
  - kind: ServiceAccount
    name: arc-vela-runner
    namespace: github-runners
roleRef:
  kind: ClusterRole
  name: arc-vela-preview-deployer
  apiGroup: rbac.authorization.k8s.io
