---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-vela
  namespace: github-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: github-runners
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    githubConfigUrl: https://github.com/lewisjared/vela
    githubConfigSecret: github-app-secret-vela
    minRunners: 0
    maxRunners: 4
    controllerServiceAccount:
      name: arc-controller-gha-rs-controller
      namespace: arc-system
    template:
      spec:
        serviceAccountName: arc-vela-runner
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/falcondev-oss/actions-runner:latest@sha256:32a63e960641cde7df61ee56e18576d9781d3980f3e6461d379308b88ec5c036
            command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          # dind runs as a native sidecar (initContainer with restartPolicy:
          # Always). The runner container below is not started until this
          # sidecar passes its startupProbe, i.e. until dockerd is actually
          # serving on the socket. Without this gate, on a cold scale-up from
          # minRunners:0 the runner picks up the job and runs "Checking docker
          # version" before dockerd has finished starting — the socket is
          # missing and the job dies with "Value cannot be null. (network)".
          - name: dind
            image: docker:29-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
            restartPolicy: Always
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            # Matches the upstream chart default dind startupProbe (since the
            # gha-runner-scale-set 0.12.0 native-sidecar change): docker info,
            # 5s interval, 24 retries (~120s window for a cold image pull).
            startupProbe:
              exec:
                command: ["docker", "info"]
              initialDelaySeconds: 0
              periodSeconds: 5
              failureThreshold: 24
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              # Dedicated volume for docker graph driver. Without this, dind
              # writes /var/lib/docker into its own containerd writable layer,
              # producing nested overlayfs (overlay-on-overlay) and killing
              # build throughput.
              - name: docker-graph
                mountPath: /var/lib/docker
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                memory: 24Gi
        containers:
          - name: runner
            image: ghcr.io/falcondev-oss/actions-runner:latest@sha256:32a63e960641cde7df61ee56e18576d9781d3980f3e6461d379308b88ec5c036
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
            envFrom:
              # CUSTOM_ACTIONS_CACHE_URL + CUSTOM_ACTIONS_RESULTS_URL point at
              # the in-cluster falcondev cache server. The falcondev runner
              # image honours them instead of the GitHub-provided cache URLs,
              # so actions/cache + buildx GHA cache stay on the LAN.
              - configMapRef:
                  name: runner-shared-env
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 16Gi
        volumes:
          - name: work
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
          - name: docker-graph
            emptyDir: {}
