---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actions-cache-server
  namespace: github-runners
  labels:
    app.kubernetes.io/name: actions-cache-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: actions-cache-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actions-cache-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cache-server
          image: ghcr.io/falcondev-oss/github-actions-cache-server:latest@sha256:3999b0202ec509f3b2084ef92cc50b408838e0d442b5997dd6dff2d89f4fe7b4
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: API_BASE_URL
              value: http://actions-cache-server.github-runners.svc.cluster.local:3000
            - name: STORAGE_DRIVER
              value: filesystem
            # Must be STORAGE_FILESYSTEM_PATH. The server ignores any other
            # name and falls back to .data/storage/filesystem, which lands the
            # blobs on the small index PVC instead of this 100Gi volume.
            - name: STORAGE_FILESYSTEM_PATH
              value: /data
            - name: CLEANUP_OLDER_THAN
              value: "7d"
          volumeMounts:
            - name: cache
              mountPath: /data
            - name: app-data
              mountPath: /app/.data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: github-actions-cache
        - name: app-data
          persistentVolumeClaim:
            claimName: github-actions-cache-db
