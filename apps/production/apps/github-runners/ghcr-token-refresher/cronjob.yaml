---
# Refreshes the ghcr-pull-secret in every vela / vela-pr-* namespace.
# Schedule is every 5 minutes so the secret is never older than 5 min
# when kubelet retries an image pull (installation tokens live 60 min;
# we trade a little extra GitHub API traffic for a much smaller window
# of "kubelet sees an expired secret" failure).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ghcr-token-refresher
  namespace: github-runners
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: ghcr-token-refresher
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: alpine/k8s:1.31.5
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/opt/refresh/refresh.sh"]
              env:
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: github-app-secret-vela
                      key: github_app_id
                - name: GITHUB_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: github-app-secret-vela
                      key: github_app_installation_id
                - name: GITHUB_APP_PRIVATE_KEY_PATH
                  value: /etc/github-app/github_app_private_key
              volumeMounts:
                - name: script
                  mountPath: /opt/refresh
                  readOnly: true
                - name: app-key
                  mountPath: /etc/github-app
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: ghcr-token-refresher-script
                defaultMode: 0o555
            - name: app-key
              secret:
                secretName: github-app-secret-vela
                items:
                  - key: github_app_private_key
                    path: github_app_private_key
                defaultMode: 0o400
