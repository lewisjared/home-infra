---
# Propagates the ghcr-pull-secret into every vela / vela-pr-* namespace.
# Schedule is every 5 minutes so a freshly-created preview namespace
# (`vela-pr-<N>` / `vela-pr-<N>-backtest`) gets a working pull secret
# within five minutes of being created, even if the workflow that
# created the namespace hasn't applied the secret yet.
#
# The secret holds a long-lived classic PAT with `read:packages`;
# rotation is manual (sops-edit `ghcr-pat-secret.yaml`). GitHub App
# installation tokens are deliberately NOT used here -- GHCR's
# registry token-exchange refuses to grant `pull` scope to App
# tokens for user-namespace packages (community discussion #24636,
# unresolved as of 2026).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ghcr-token-refresher
  namespace: github-runners
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: ghcr-token-refresher
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/opt/refresh/refresh.sh"]
              env:
                - name: GHCR_PULL_USER
                  valueFrom:
                    secretKeyRef:
                      name: ghcr-pat-secret
                      key: ghcr_pull_user
                - name: GHCR_PULL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ghcr-pat-secret
                      key: ghcr_pull_token
              volumeMounts:
                - name: script
                  mountPath: /opt/refresh
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: ghcr-token-refresher-script
                defaultMode: 0o555
