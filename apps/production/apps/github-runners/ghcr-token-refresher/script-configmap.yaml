apiVersion: v1
kind: ConfigMap
metadata:
  name: ghcr-token-refresher-script
  namespace: github-runners
data:
  # NOTE: every shell ${VAR} below is written as $${VAR}. The Flux
  # Kustomization at apps/production/apps/github-runners/ks.yaml runs
  # envsubst-style postBuild substitution on this manifest, and any
  # unescaped `${VAR}` resolves to the empty string before the
  # ConfigMap is applied. `$${...}` is the documented escape; Flux
  # collapses it to a literal `${...}` so the shell sees the value
  # it expects at run time. Bare `$var`, `$(...)`, and `$((...))` are
  # not touched by Flux and stay as-is.
  refresh.sh: |
    #!/bin/sh
    # Write a long-lived PAT as a dockerconfigjson Secret named
    # `ghcr-pull-secret` into every namespace whose name matches
    # `vela` or `vela-pr-*`.
    #
    # GitHub App installation tokens look like a clean fit here, but
    # GHCR's registry token-exchange refuses to grant `pull` scope to
    # them for user-namespace packages (community discussion #24636,
    # still unresolved as of 2026). The refresher therefore propagates
    # a long-lived classic PAT with `read:packages` instead. The PAT
    # never expires; this CronJob exists only to populate the secret
    # in freshly-created preview namespaces (`vela-pr-*`) where the
    # workflow Job can't reach in time, and to converge anything that
    # drifts.
    set -eu

    : "$${GHCR_PULL_USER:?missing}"
    : "$${GHCR_PULL_TOKEN:?missing}"

    auth=$(printf '%s:%s' "$${GHCR_PULL_USER}" "$${GHCR_PULL_TOKEN}" \
      | base64 | tr -d '\n')
    dockerconfig=$(printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$${auth}")
    encoded=$(printf '%s' "$${dockerconfig}" | base64 | tr -d '\n')

    # Match `vela` (production) and any preview namespace pair
    # `vela-pr-<N>` / `vela-pr-<N>-backtest`. Other namespaces are
    # left untouched so this CronJob can't leak a token by writing
    # a secret somewhere unintended.
    matched=0
    for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
      case "$ns" in
        vela | vela-pr-*)
          matched=$((matched + 1))
          cat <<MANIFEST | kubectl apply -f - >/dev/null
    apiVersion: v1
    kind: Secret
    metadata:
      name: ghcr-pull-secret
      namespace: $${ns}
    type: kubernetes.io/dockerconfigjson
    data:
      .dockerconfigjson: $${encoded}
    MANIFEST
          echo "refreshed ghcr-pull-secret in $${ns}"
          ;;
      esac
    done
    echo "refreshed $${matched} namespaces"
