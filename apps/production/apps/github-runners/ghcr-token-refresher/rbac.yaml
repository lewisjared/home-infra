---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-token-refresher
  namespace: github-runners
---
# Cluster-scoped because the refresher writes the pull secret into
# every namespace matching `vela` or `vela-pr-*`, and Kubernetes RBAC
# can't scope a rule to a name pattern. The CronJob's script applies
# the policy in code: it only writes to namespaces that match the
# pattern. `resourceNames: [ghcr-pull-secret]` pins the mutate/read
# verbs to a single secret name across the cluster.
#
# `create` is split into its own rule because Kubernetes RBAC ignores
# `resourceNames` for `create` (the resource doesn't exist yet, so
# its name can't be checked against the allowlist). Without this rule
# the refresher's `kubectl apply` falls back to create in any
# namespace where ghcr-pull-secret is missing (e.g. a fresh
# `vela-pr-<N>-backtest` preview namespace) and fails with Forbidden.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ghcr-token-refresher
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ghcr-pull-secret"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ghcr-token-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ghcr-token-refresher
subjects:
  - kind: ServiceAccount
    name: ghcr-token-refresher
    namespace: github-runners
