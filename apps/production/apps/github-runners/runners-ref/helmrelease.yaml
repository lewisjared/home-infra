---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: actions-runner-controller
  namespace: github-runners
spec:
  type: oci
  url: oci://ghcr.io/actions/actions-runner-controller-charts
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-climate-ref
  namespace: github-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: github-runners
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    githubConfigUrl: https://github.com/Climate-REF
    githubConfigSecret: github-app-secret
    minRunners: 0
    maxRunners: 6
    controllerServiceAccount:
      name: arc-controller-gha-rs-controller
      namespace: arc-system
    template:
      spec:
        # The CMIP6 NFS share is written by climate-ref pods running as 1000:1000.
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        initContainers:
          - name: setup-cache-dirs
            image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
            securityContext:
              runAsUser: 0
            # Create the cache directories and set permissions so that the runner can write to them.
            # Also create the intake-esgf config file for the runner to use.
            # We mount the climate-ref cmip6 data to the runner pods as read-only.
            # Any runner-specific data are written to the cache directory.
            command:
              - sh
              - -c
              - |
                mkdir -p /data/cache/datasets /data/cache/software /data/cache/intake-esgf-data
                # The cache is a persistent RWX NFS share and the runner writes as
                # uid 1000, so its contents are already owned correctly after the
                # first provisioning. A `chown -R` over the conda/software tree on
                # every start takes many minutes, so do the deep pass only once
                # (guarded by a sentinel) and otherwise just fix the top-level dirs.
                if [ ! -e /data/cache/.ownership-initialised ]; then
                  chown -R 1000:1000 /data/cache
                  touch /data/cache/.ownership-initialised
                else
                  chown 1000:1000 /data/cache /data/cache/datasets /data/cache/software /data/cache/intake-esgf-data
                fi
                chmod 777 /data/cache/datasets /data/cache/software /data/cache/intake-esgf-data

                mkdir -p /home-config/intake-esgf
                cat > /home-config/intake-esgf/conf.yaml <<'EOF'
                esg_dataroot:
                  - /data/cmip6
                local_cache:
                  - ~/.esgf
                confirm_download: false
                num_threads: 20
                EOF

                mkdir -p /home-config/dask
                cat > /home-config/dask/config.yaml <<'EOF'
                scheduler: synchronous
                EOF

                mkdir -p /home-config/esmvaltool
                cat > /home-config/esmvaltool/config.yaml <<'EOF'
                max_parallel_tasks: 2
                dask:
                  use: local_distributed
                  profiles:
                    local_distributed:
                      cluster:
                        type: distributed.LocalCluster
                        n_workers: 2
                        threads_per_worker: 2
                        memory_limit: 4GiB
                EOF

                chmod -R 777 /home-config
            volumeMounts:
              - name: runner-cache
                mountPath: /data/cache
              - name: home-config
                mountPath: /home-config
        containers:
          - name: runner
            image: ghcr.io/falcondev-oss/actions-runner:latest@sha256:2cae51372fb9457b48d72e5592d7d100faeb38f7231bb27267847adce2931a2b
            command: ["/home/runner/run.sh"]
            # Match the writer UID on the shared NFS share at 10.10.30.20:/mnt/tank/climate-ref/cmip6.
            # The climate-ref ingest and esgpull cronjobs run as 1000:1000.
            # Without this,
            # the runner image's default UID 1001 hits EACCES on individual cached netCDFs,
            # even though the directory listing succeeds.
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            # ILAMB integration tests load whole reference netCDFs into memory under the synchronous Dask scheduler,
            # which has no per-worker cap. A single large ocean field (e.g. so_Omon_CanESM5_historical) materialises
            # to many GiB when opened whole (ilamb3 opens without dask chunks, so a lazy surface slice still reads
            # the full field), and the whole --slow suite runs in one pytest process that does not release between
            # tests, so peak RSS climbed past the 16Gi ceiling (INTERNALERROR MemoryError). 40Gi leaves headroom on
            # the two ~49Gi allocatable nodes; going much higher needs pinning the job to talos-master-3 (~79Gi)
            # since the memory request is only 4Gi.
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                memory: 40Gi
            volumeMounts:
              # RO CMIP6 archive
              - name: cmip6-data
                mountPath: /data/cmip6
                readOnly: true
              # RW cache for runner-specific data (e.g. test outputs, downloaded software, etc.)
              - name: runner-cache
                mountPath: /data/cache
              # Local intake-esgf cache
              - name: runner-cache
                mountPath: /home/runner/.esgf
                subPath: intake-esgf-data
              # Runner .config dir (intake-esgf config, matplotlib, etc.)
              - name: home-config
                mountPath: /home/runner/.config
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: REF_CONFIGURATION
                value: /tmp/climate-ref-config
              - name: REF_DATASET_CACHE_DIR
                value: /data/cache/datasets
              - name: REF_SOFTWARE_ROOT
                value: /data/cache/software
              # Set a reasonable width for the rich tracebacks
              - name: "COLUMNS"
                value: "200"
              - name: "USER"
                value: "runner"
            envFrom:
              # CUSTOM_ACTIONS_CACHE_URL + CUSTOM_ACTIONS_RESULTS_URL -> in-cluster falcondev cache server via the falcondev runner image override.
              - configMapRef:
                  name: runner-shared-env
        volumes:
          - name: cmip6-data
            persistentVolumeClaim:
              claimName: github-runners-cmip6-csi
          - name: runner-cache
            persistentVolumeClaim:
              claimName: github-runners-cache-csi
          - name: home-config
            emptyDir: {}
