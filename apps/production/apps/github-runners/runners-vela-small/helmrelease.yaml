---
# Lightweight runner pool for lint/test/check jobs
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-vela-small
  namespace: github-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: github-runners
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    githubConfigUrl: https://github.com/lewisjared/vela
    githubConfigSecret: github-app-secret-vela
    minRunners: 0
    maxRunners: 8
    controllerServiceAccount:
      name: arc-controller-gha-rs-controller
      namespace: arc-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/falcondev-oss/actions-runner:latest@sha256:b0cbd599b4124962a91930f85b0061adc5a5aaf874221d29741411fc661a259b
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            envFrom:
              # CUSTOM_ACTIONS_CACHE_URL + CUSTOM_ACTIONS_RESULTS_URL ->
              # in-cluster falcondev cache server via the falcondev runner
              # image override.
              - configMapRef:
                  name: runner-shared-env
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
