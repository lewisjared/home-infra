---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: ">=0.25.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: headlamp
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    recreate: true
    cleanupOnFail: true
  values:
    replicaCount: 1

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: false

    config:
      sessionTTL: "2592000"
      inCluster: false
      extraArgs:
        - -kubeconfig
        - /kubeconfig/config

    clusterRoleBinding:
      create: false

    serviceAccount:
      create: true
      name: headlamp

    volumes:
      - name: kubeconfig
        configMap:
          name: headlamp-kubeconfig

    volumeMounts:
      - name: kubeconfig
        mountPath: /kubeconfig
        readOnly: true

    podAnnotations:
      app.kubernetes.io/part-of: home-infra
