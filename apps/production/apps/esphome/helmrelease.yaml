---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
  namespace: esphome
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      # hostNetwork required so ESPHome can reach IoT devices on VLAN 50 directly.
      # The pod uses the node's network stack; OPNsense rules govern actual reachability.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Pin to a node labelled `esphome=true` so the source IP is predictable
      # for the OPNsense rule allowing VLAN 20 -> VLAN 50 traffic.
      # Apply with: kubectl label node <hostname> esphome=true
      nodeSelector:
        esphome: "true"

    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/esphome/esphome
              tag: "2026.4.5@sha256:7419641c7fd8e37d6362f71c458bb17570f1f471cfea3b022b30dfd8117a2361"
            env:
              TZ: Australia/Melbourne
              # Use ICMP ping for device status; mDNS doesn't cross VLANs
              ESPHOME_DASHBOARD_USE_PING: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 6052
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: *port

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: rook-ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
