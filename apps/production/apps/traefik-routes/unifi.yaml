---
# UniFi serves its UI over HTTPS with a self-signed cert.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-transport
  namespace: traefik
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: unifi.home.lewelly.com
    external-dns.alpha.kubernetes.io/target: 10.10.20.200
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`unifi.home.lewelly.com`)
      kind: Rule
      middlewares:
        - name: authelia-forwardauth
      services:
        - name: unifi-main
          namespace: unifi
          port: 8443
          scheme: https
          serversTransport: traefik-unifi-transport@kubernetescrd
  tls:
    secretName: home-gateway-tls
