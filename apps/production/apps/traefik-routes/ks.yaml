---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-routes
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/traefik-routes
  prune: true
  wait: false
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
    - name: security
  components:
    - ../../../../components/alerts
  postBuild:
    substitute:
      APP: traefik-routes
