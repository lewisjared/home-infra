---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-rocm-test
  namespace: ollama-rocm-test
  labels:
    app.kubernetes.io/name: ollama-rocm-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-rocm-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-rocm-test
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-master-2
      tolerations:
        - operator: Exists
      containers:
        - name: ollama
          image: ollama/ollama:rocm
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_DEBUG
              value: INFO
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "10.3.0"
            - name: HSA_ENABLE_SDMA
              value: "0"
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: models
          emptyDir: {}
        - name: dev-kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
