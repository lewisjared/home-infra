---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      # Embedding workloads are small enough to run comfortably on CPU. Prefer the
      # nodes with exposed iGPUs so we can switch to the ROCm image/device mounts
      # later without moving persistent model data between nodes.
      nodeSelector:
        gpu: amd-igpu
      containers:
        - name: ollama
          image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              ollama serve &
              pid="$!"
              trap 'kill "$pid"' INT TERM
              until ollama list >/dev/null 2>&1; do
                sleep 2
              done
              ollama pull nomic-embed-text
              wait "$pid"
          env:
            - name: TZ
              value: Australia/Melbourne
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_VULKAN
              value: "1"
            - name: OLLAMA_LLM_LIBRARY
              value: vulkan
            - name: OLLAMA_DEBUG
              value: INFO
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - ollama list | grep -q '^nomic-embed-text'
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: kfd
              mountPath: /dev/kfd
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
        - name: tmp
          emptyDir: {}
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
