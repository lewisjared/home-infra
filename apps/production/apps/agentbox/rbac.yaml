---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbox
  namespace: agentbox
---
# Read-only cluster view for agents: the built-in `view` role excludes Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentbox-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: agentbox
    namespace: agentbox
