---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentbox
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/agentbox
  # Instances are created and destroyed by the herdr-agentbox plugin, outside Flux.
  # Flux owns only the shared namespace, identity and policy, so pruning never touches them.
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
