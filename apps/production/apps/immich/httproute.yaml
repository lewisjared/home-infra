---
# No Authelia forward-auth: the mobile app calls the API with Immich's own tokens.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: home-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - immich.home.lewelly.com
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
