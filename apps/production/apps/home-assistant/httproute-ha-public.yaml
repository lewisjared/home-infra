---
# Public-facing Home Assistant at ha.lewelly.com via cloudflared lewelly tunnel + traefik public-gateway.
# Authelia policy = bypass (HA has native auth; mobile app needs raw API/websocket).
# Internal route at ha.home.lewelly.com (see httproute-ha.yaml) unchanged.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-public
  namespace: home-assistant
  labels:
    app.kubernetes.io/part-of: home-infra
    exposure: public
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - ha.lewelly.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: home-assistant
          port: 8123
