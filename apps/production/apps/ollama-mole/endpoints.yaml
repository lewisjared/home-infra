---
apiVersion: v1
kind: Service
metadata:
  name: ollama-mole-raw
  namespace: ollama-mole
  labels:
    app.kubernetes.io/name: ollama-mole
    app.kubernetes.io/component: raw-api
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama-mole-raw
  namespace: ollama-mole
  labels:
    kubernetes.io/service-name: ollama-mole-raw
    app.kubernetes.io/name: ollama-mole
    app.kubernetes.io/component: raw-api
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 11434
endpoints:
  - addresses:
      - 10.10.20.20
