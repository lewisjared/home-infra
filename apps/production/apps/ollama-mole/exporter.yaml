---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-mole-exporter
  namespace: ollama-mole
  labels:
    app.kubernetes.io/name: ollama-mole
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-mole
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-mole
        app.kubernetes.io/component: exporter
    spec:
      containers:
        - name: exporter
          image: ghcr.io/maravexa/ollama-exporter:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_URL
              value: http://ollama-mole-raw.ollama-mole.svc.cluster.local:11434
            - name: LISTEN_ADDR
              value: :9400
            - name: POLL_INTERVAL
              value: 15s
            - name: LOG_LEVEL
              value: info
          ports:
            - name: metrics
              containerPort: 9400
            - name: proxy
              containerPort: 9401
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
