---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/production/apps/homepage
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: core
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  components:
    - ../../../../components/alerts
  postBuild:
    substitute:
      APP: homepage
