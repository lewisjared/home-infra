---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-rocm
  namespace: ollama-rocm
  labels:
    app.kubernetes.io/name: ollama-rocm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-rocm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-rocm
    spec:
      nodeSelector:
        gpu: amd-igpu
      tolerations:
        - operator: Exists
      containers:
        - name: ollama
          image: ollama/ollama:rocm
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_DEBUG
              value: INFO
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_IGPU_ENABLE
              value: "1"
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "10.3.0"
            - name: HSA_ENABLE_SDMA
              value: "0"
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 48Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-rocm-models
        - name: dev-kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
