---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devbox
resources:
  - namespace.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - l2-announcement.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: devbox-boot
    files:
      - boot.sh
      - authorized_keys
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # boot.sh uses shell variables that Flux would otherwise blank.
    kustomize.toolkit.fluxcd.io/substitute: disabled
