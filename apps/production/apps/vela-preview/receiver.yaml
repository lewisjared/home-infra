# Lets an in-cluster caller nudge vela-preview-prs to reconcile immediately
# instead of waiting for its 2m poll interval — e.g. right after
# docker-build.yml pushes a new pr-<n>-<sha7> image.
#
# There is no public ingress for GitHub-hosted webhooks to reach this
# cluster, so GitHub itself can never call this Receiver. The intended
# caller is something already inside the cluster — vela's in-cluster arc
# runner (or any other in-cluster job) — posting directly to the
# webhook-receiver Service:
#
#   http://webhook-receiver.flux-system.svc.cluster.local/<path>
#
# <path> is generated per-Receiver and only known after apply. Read it with:
#
#   kubectl get receiver vela-preview-github -n flux-system -o jsonpath='{.status.webhookPath}'
#
# The "ping" and "pull_request" event types are accepted for compatibility
# with GitHub's webhook payload shape, but the payload contents are not
# inspected — any POST to the path triggers a reconcile of the resources
# below.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: vela-preview-github
  namespace: flux-system
spec:
  type: github
  events:
    - "ping"
    - "pull_request"
  secretRef:
    name: vela-preview-webhook-token
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: vela-preview-prs
      namespace: flux-system
