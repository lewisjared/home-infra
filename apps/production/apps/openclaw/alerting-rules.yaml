---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openclaw-alerts
  namespace: openclaw
  labels:
    prometheus: kube-prometheus
    release: kube-prometheus-stack
spec:
  groups:
    - name: openclaw-health
      rules:
        - alert: OpenClawDown
          expr: |
            absent(kube_deployment_status_replicas_available{namespace="openclaw", deployment="openclaw"})
            or kube_deployment_status_replicas_available{namespace="openclaw", deployment="openclaw"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OpenClaw is down"
            description: "OpenClaw deployment has no available replicas for more than 5 minutes."

        - alert: OpenClawCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="openclaw", container="main"}[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OpenClaw is crash looping"
            description: "OpenClaw container has restarted {{ $value | humanize }} times in the last 15 minutes."

        - alert: OpenClawHighMemory
          expr: |
            container_memory_working_set_bytes{namespace="openclaw", container="main"}
            / on(namespace, pod) group_left()
            kube_pod_container_resource_limits{namespace="openclaw", container="main", resource="memory"}
            > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenClaw memory usage is high"
            description: "OpenClaw is using {{ $value | humanizePercentage }} of its memory limit."

        - alert: OpenClawOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{namespace="openclaw", container="main", reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "OpenClaw was OOM killed"
            description: "OpenClaw container was terminated due to out of memory."

        - alert: OpenClawPVCAlmostFull
          expr: |
            kubelet_volume_stats_used_bytes{namespace="openclaw"}
            / kubelet_volume_stats_capacity_bytes{namespace="openclaw"}
            > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "OpenClaw PVC almost full"
            description: "OpenClaw persistent volume is {{ $value | humanizePercentage }} full."

        - alert: OpenClawNotReady
          expr: |
            kube_pod_status_ready{namespace="openclaw", condition="true"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenClaw pod is not ready"
            description: "OpenClaw pod has not been ready for more than 10 minutes."
