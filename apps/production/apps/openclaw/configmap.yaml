---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "port": 18789,
        "bind": "lan",
        "controlUi": {
          "allowedOrigins": [
            "https://openclaw.home.lewelly.com",
            "http://localhost:18789",
            "http://127.0.0.1:18789"
          ]
        }
      },
      "browser": {
        "enabled": false
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "kilocode/kilo/auto"
          },
          "sandbox": {
            "mode": "off"
          }
        }
      },
      "channels": {
        "slack": {
          "mode": "socket",
          "dmPolicy": "pairing",
          "groupPolicy": "open"
        }
      },
      "session": {
        "dmScope": "per-channel-peer"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-env
  namespace: openclaw
data:
  NODE_ENV: "production"
