apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
spec:
  instances: 1
  # Single-instance cluster — disable the auto-generated PDB so node drains
  # during Talos/k8s upgrades can evict postgres. CNPG's PreStop hook still
  # performs a graceful shutdown.
  enablePDB: false
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      shared_buffers: "256MB"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all

  storage:
    size: 10Gi
    storageClass: rook-ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      - name: date_jar_migrator
        login: true
        passwordSecret:
          name: date-jar-migrator-password
      - name: date_jar_app
        login: true
        passwordSecret:
          name: date-jar-app-password

  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://postgres-barman/postgres
      endpointURL: http://s3proxy.database.svc.cluster.local
      s3Credentials:
        accessKeyId:
          name: postgres-barman-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-barman-s3-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip

  bootstrap:
    initdb:
      database: app
      owner: app
