---
# IP Pool for LoadBalancer services
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: home-pool
spec:
  blocks:
    - start: 10.10.20.200
      stop: 10.10.20.250
---
# L2 Announcement Policy - announces LoadBalancer IPs via ARP
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  loadBalancerIPs: true
  interfaces:
    # Talos uses predictable interface names (ens18/ens19); the old ^eth[0-9]+
    # regex matched nothing post-migration, so the LoadBalancer VIP was never
    # ARP-announced on the LAN. Match both schemes to be safe.
    - ^(eth|ens)[0-9]+
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
