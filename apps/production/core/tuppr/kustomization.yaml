apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer: the HelmRepository/HelmRelease declare their own
# namespace, and the TalosUpgrade/KubernetesUpgrade CRs are cluster-scoped — a
# transformer would wrongly stamp a namespace onto them.
resources:
  - namespace.yaml
  - tuppr.yaml
  - talos-upgrade.yaml
  - kubernetes-upgrade.yaml
  - talos-igpu-upgrade-master-1.yaml
