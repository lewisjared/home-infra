apiVersion: batch/v1
kind: Job
metadata:
  name: talos-igpu-diag-3
  namespace: system-upgrade
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - operator: Exists
      containers:
        - name: talosctl
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eux
              wget -O /usr/local/bin/talosctl https://github.com/siderolabs/talos/releases/download/v1.12.8/talosctl-linux-amd64
              chmod +x /usr/local/bin/talosctl
              NODE=10.10.20.52
              echo "===== version ====="
              talosctl --nodes "$NODE" version --short
              echo "===== extensions ====="
              talosctl --nodes "$NODE" get extensions
              echo "===== cmdline ====="
              talosctl --nodes "$NODE" read /proc/cmdline || true
              echo "===== kernel memory params ====="
              talosctl --nodes "$NODE" read /sys/module/ttm/parameters/pages_limit || true
              talosctl --nodes "$NODE" read /sys/module/amdgpu/parameters/gttsize || true
              echo "===== dev nodes ====="
              talosctl --nodes "$NODE" ls /dev/dri || true
              talosctl --nodes "$NODE" ls /dev/kfd || true
              echo "===== amdgpu/kfd dmesg ====="
              talosctl --nodes "$NODE" dmesg | grep -Ei 'amdgpu|kfd|drm|gfx|gtt|ttm|granite|radeon' | tail -240 || true
          volumeMounts:
            - mountPath: /var/run/secrets/talos.dev
              name: talos-secrets
      volumes:
        - name: talos-secrets
          secret:
            secretName: talos-igpu-diag-3-talos-secrets
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-igpu-diag-3-talos-secrets
  namespace: system-upgrade
spec:
  roles:
    - os:reader
