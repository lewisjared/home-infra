apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-releases
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventSeverity: info
  eventSources:
    - kind: HelmRelease
      name: "*"
      namespace: apps
    - kind: HelmRelease
      name: "*"
      namespace: media
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: ImageUpdateAutomation
      name: "*"
  exclusionList:
    - "info.*no changes"
    - "Helm install has started"
    - "Helm upgrade has started"
