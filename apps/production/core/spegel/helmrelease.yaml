apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: spegel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spegel
  values:
    spegel:
      # Talos owns containerd registry config via machine.registries.mirrors,
      # so Spegel must not write its own hosts.toml files.
      containerdMirrorAdd: false
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
    service:
      registry:
        hostPort: 29999
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    serviceMonitor:
      enabled: true
