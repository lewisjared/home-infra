---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    release: kube-prometheus-stack
spec:
  groups:
    - name: node-alerts
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} is down"
            description: >-
              Node exporter on {{ $labels.instance }} has been
              down for more than 5 minutes.

        - alert: NodeHighCPU
          # yamllint disable-line rule:line-length
          expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])) * 100) > 90
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on {{ $labels.instance }}"
            description: >-
              CPU usage is above 90% for more than 30 minutes.

        - alert: ControlPlaneHighMemory
          # yamllint disable-line rule:line-length
          expr: (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) * 100 > 95 and on(instance) label_replace(kube_node_role{role="control-plane"}, "instance", "$1", "node", "(.*)")
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              High memory on control-plane node
              {{ $labels.instance }}
            description: >-
              Memory usage is {{ $value | humanize }}%
              on {{ $labels.instance }}.

        - alert: WorkerHighMemory
          # yamllint disable-line rule:line-length
          expr: (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) * 100 > 85 unless on(instance) label_replace(kube_node_role{role="control-plane"}, "instance", "$1", "node", "(.*)")
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              High memory on worker node
              {{ $labels.instance }}
            description: >-
              Memory usage is {{ $value | humanize }}%
              on {{ $labels.instance }}.

        - alert: NodeMemoryPressure
          # yamllint disable-line rule:line-length
          expr: rate(node_pressure_memory_stalled_seconds_total{job="node-exporter"}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Memory pressure on {{ $labels.instance }}
            description: >-
              Node {{ $labels.instance }} has memory pressure
              (PSI stall > 5%) for 5 minutes.

        - alert: NodeDiskAlmostFull
          # yamllint disable-line rule:line-length
          expr: (1 - node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node-exporter"}) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Disk almost full on {{ $labels.instance }}"
            description: >-
              Disk {{ $labels.mountpoint }} is above 85% full.

    # Pod/Deployment/PVC alerts covered by kube-prometheus-stack
    # default rules (kubernetesApps + kubernetesStorage)

    - name: certificate-alerts
      rules:
        - alert: CertificateExpiringSoon
          # yamllint disable-line rule:line-length
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }}
              expires in less than 7 days
            description: >-
              Certificate will expire in
              {{ $value | humanizeDuration }}.

        - alert: CertificateExpiryCritical
          # yamllint disable-line rule:line-length
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 86400
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }}
              expires in less than 24 hours
            description: >-
              Certificate will expire in
              {{ $value | humanizeDuration }}.

    - name: flux-alerts
      rules:
        - alert: FluxReconciliationFailure
          # yamllint disable-line rule:line-length
          expr: gotk_reconcile_condition{status="False",type="Ready"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              Flux {{ $labels.kind }}/{{ $labels.name }}
              reconciliation failing
            description: >-
              {{ $labels.kind }}
              {{ $labels.namespace }}/{{ $labels.name }}
              has been failing for 30 minutes.

    - name: proxmox-alerts
      rules:
        - alert: ProxmoxNodeDown
          expr: up{job="proxmox-node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Proxmox host {{ $labels.instance }} is unreachable
            description: >-
              node_exporter on Proxmox host
              {{ $labels.instance }} has been down for more
              than 5 minutes.

        - alert: ProxmoxHighTemperature
          # yamllint disable-line rule:line-length
          expr: node_hwmon_temp_celsius{job="proxmox-node-exporter"} > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              High temperature on Proxmox host
              {{ $labels.instance }}
            description: >-
              Sensor {{ $labels.chip }}/{{ $labels.sensor }}
              on {{ $labels.instance }} is at {{ $value }}C.

        - alert: ProxmoxCriticalTemperature
          # yamllint disable-line rule:line-length
          expr: node_hwmon_temp_celsius{job="proxmox-node-exporter"} > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: >-
              Critical temperature on Proxmox host
              {{ $labels.instance }}
            description: >-
              Sensor {{ $labels.chip }}/{{ $labels.sensor }}
              on {{ $labels.instance }} is at {{ $value }}C.
              Immediate attention required.

        - alert: ProxmoxHighMemory
          # yamllint disable-line rule:line-length
          expr: (1 - node_memory_MemAvailable_bytes{job="proxmox-node-exporter",instance!="mole"} / node_memory_MemTotal_bytes{job="proxmox-node-exporter",instance!="mole"}) * 100 > 90
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              High memory on Proxmox host
              {{ $labels.instance }}
            description: >-
              Memory usage is {{ $value | humanize }}%
              on {{ $labels.instance }}.

        - alert: ProxmoxMemoryPressure
          # yamllint disable-line rule:line-length
          expr: rate(node_pressure_memory_stalled_seconds_total{job="proxmox-node-exporter"}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Memory pressure on Proxmox host
              {{ $labels.instance }}
            description: >-
              Proxmox host {{ $labels.instance }} has memory
              pressure (PSI stall > 5%) for 5 minutes.

        - alert: ProxmoxDiskAlmostFull
          # yamllint disable-line rule:line-length
          expr: (1 - node_filesystem_avail_bytes{job="proxmox-node-exporter",fstype!~"tmpfs|overlay|fuse.*|nfs.*"} / node_filesystem_size_bytes{job="proxmox-node-exporter",fstype!~"tmpfs|overlay|fuse.*|nfs.*"}) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Disk almost full on Proxmox host
              {{ $labels.instance }}
            description: >-
              {{ $labels.mountpoint }} on
              {{ $labels.instance }} is
              {{ $value | humanize }}% full.
