---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-iscsi-fast
provisioner: org.democratic-csi.iscsi
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  fsType: ext4
  csi.storage.k8s.io/provisioner-secret-name: democratic-csi-iscsi-config
  csi.storage.k8s.io/provisioner-secret-namespace: democratic-csi
  csi.storage.k8s.io/controller-publish-secret-name: democratic-csi-iscsi-config
  csi.storage.k8s.io/controller-publish-secret-namespace: democratic-csi
  csi.storage.k8s.io/node-stage-secret-name: democratic-csi-iscsi-config
  csi.storage.k8s.io/node-stage-secret-namespace: democratic-csi
  csi.storage.k8s.io/node-publish-secret-name: democratic-csi-iscsi-config
  csi.storage.k8s.io/node-publish-secret-namespace: democratic-csi
  csi.storage.k8s.io/controller-expand-secret-name: democratic-csi-iscsi-config
  csi.storage.k8s.io/controller-expand-secret-namespace: democratic-csi
