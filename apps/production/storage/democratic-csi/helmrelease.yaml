---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  interval: 1h
  url: https://democratic-csi.github.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-iscsi
  namespace: democratic-csi
spec:
  interval: 15m
  chart:
    spec:
      chart: democratic-csi
      version: ">=0.15.0 <0.16.0"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: democratic-csi
      interval: 1h
  values:
    csiDriver:
      name: "org.democratic-csi.iscsi"

    # StorageClass + VolumeSnapshotClass shipped as separate manifests so
    # parameters can be SOPS-managed alongside the driver Secret.
    storageClasses: []
    volumeSnapshotClasses: []

    # Chart templates read driver.config.driver to pick iscsi vs nfs
    # mount helpers. Full connection config lives in the external Secret
    # referenced by driver.existingConfigSecret.
    driver:
      existingConfigSecret: democratic-csi-iscsi-config
      config:
        driver: freenas-api-iscsi

    controller:
      driver:
        image:
          tag: v1.9.5
      externalAttacher:
        enabled: true
      externalProvisioner:
        enabled: true
      externalResizer:
        enabled: true
      externalSnapshotter:
        enabled: true

    node:
      driver:
        image:
          tag: v1.9.5

    # Talos kubelet path.
    kubeletHostPath: /var/lib/kubelet
