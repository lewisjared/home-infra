---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  interval: 1h
  url: https://democratic-csi.github.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-iscsi
  namespace: democratic-csi
spec:
  interval: 15m
  chart:
    spec:
      chart: democratic-csi
      version: ">=0.14.0 <0.15.0"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: democratic-csi
      interval: 1h
  values:
    csiDriver:
      name: "org.democratic-csi.iscsi"

    # StorageClass + VolumeSnapshotClass shipped as separate manifests so
    # parameters can be SOPS-managed alongside the driver Secret.
    storageClasses: []
    volumeSnapshotClasses: []

    # Driver config lives in an external Secret (SOPS-encrypted). The
    # Secret key `driver-config-file.yaml` is rendered into the controller
    # pod at /etc/csi-config/driver-config-file.yaml.
    controller:
      driver:
        existingConfigSecret: democratic-csi-iscsi-config
      externalAttacher:
        enabled: true
      externalProvisioner:
        enabled: true
      externalResizer:
        enabled: true
      externalSnapshotter:
        enabled: true

    node:
      driver:
        existingConfigSecret: democratic-csi-iscsi-config

    # Talos kubelet path.
    kubeletHostPath: /var/lib/kubelet
