# TrueNAS custom app, installed and updated by setup.sh.
# Host layout and first-run steps are in README.md next to this file.
services:
  kopia:
    image: kopia/kopia:0.23.1@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
    container_name: offsite-backup
    hostname: mole
    restart: unless-stopped
    entrypoint: ["/scripts/offsite-backup.sh"]
    command: ["run"]
    env_file: /mnt/tank/backups/offsite/kopia.env
    environment:
      TZ: Australia/Melbourne
      KOPIA_CONFIG_PATH: /app/config/repository.config
      KOPIA_CACHE_DIRECTORY: /app/cache
      KOPIA_LOG_DIR: /app/logs
    # Root with only DAC_READ_SEARCH: reads every source file but cannot write to them.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # rslave lets the ZFS snapshot automounts under .zfs/snapshot appear inside the container.
      - type: bind
        source: /mnt/tank/photos
        target: /data/photos
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /mnt/tank/backups/k8s
        target: /data/k8s
        read_only: true
        bind:
          propagation: rslave
      - /mnt/tank/backups/offsite/scripts:/scripts:ro
      - /mnt/tank/backups/offsite/config:/app/config
      - /mnt/tank/backups/offsite/cache:/app/cache
      - /mnt/tank/backups/offsite/logs:/app/logs
      - /mnt/tank/backups/offsite/state:/state
      - /mnt/tank/backups/offsite/metrics:/metrics

  metrics:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    container_name: offsite-backup-metrics
    restart: unless-stopped
    user: "65534:65534"
    command: ["httpd", "-f", "-p", "9851", "-h", "/www"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "9851:9851"
    volumes:
      - /mnt/tank/backups/offsite/metrics:/www:ro
