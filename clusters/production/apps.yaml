---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/apps
  # prune temporarily disabled during per-app ks.yaml migration
  # to prevent deletion of resources transferring ownership.
  # Re-enable after all per-app Kustomizations are stable.
  prune: false
  wait: false
  dependsOn:
    - name: core
    - name: storage
    - name: security
    - name: database-clusters
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
